apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-api
  namespace: tcc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-api
  template:
    metadata:
      labels:
        app: mock-api
    spec:
      containers:
        - name: mock-api
          image: us-central1-docker.pkg.dev/tcc-performance-2026/tcc-benchmarks/mock-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MIN_LATENCY_MS
              value: "200"
            - name: MAX_LATENCY_MS
              value: "500"
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mock-api
  namespace: tcc
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mock-api
