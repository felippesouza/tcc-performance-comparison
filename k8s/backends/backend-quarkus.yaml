apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-quarkus
  namespace: tcc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-quarkus
  template:
    metadata:
      labels:
        app: backend-quarkus
    spec:
      nodeSelector:
        role: benchmark
      containers:
        - name: backend-quarkus
          image: us-central1-docker.pkg.dev/tcc-performance-2026/tcc-benchmarks/backend-quarkus:latest
          ports:
            - containerPort: 8083
          env:
            - name: DB_HOST
              value: postgres-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: gateway_db
            - name: DB_USER
              value: user
            - name: DB_PASSWORD
              value: password
            - name: REDIS_HOST
              value: redis-cache
            - name: EXTERNAL_API_URL
              value: http://mock-api:8080
            - name: AGROAL_MAX_POOL_SIZE
              value: "200"
            - name: REDIS_MAX_POOL_SIZE
              value: "200"
            - name: QUARKUS_MAX_THREADS
              value: "600"
            - name: REST_CLIENT_POOL_SIZE
              value: "600"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-quarkus
  namespace: tcc
spec:
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: backend-quarkus
