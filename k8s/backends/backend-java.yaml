apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-java
  namespace: tcc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-java
  template:
    metadata:
      labels:
        app: backend-java
    spec:
      nodeSelector:
        role: benchmark
      containers:
        - name: backend-java
          image: us-central1-docker.pkg.dev/tcc-performance-2026/tcc-benchmarks/backend-java:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-db:5432/gateway_db
            - name: SPRING_DATASOURCE_USERNAME
              value: user
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: EXTERNAL_API_BASE_URL
              value: http://mock-api:8080
            - name: SPRING_DATA_REDIS_HOST
              value: redis-cache
            - name: HIKARI_MAX_POOL_SIZE
              value: "200"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-java
  namespace: tcc
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: backend-java
