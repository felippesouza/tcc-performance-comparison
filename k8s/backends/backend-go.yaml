apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-go
  namespace: tcc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-go
  template:
    metadata:
      labels:
        app: backend-go
    spec:
      nodeSelector:
        role: benchmark
      containers:
        - name: backend-go
          image: us-central1-docker.pkg.dev/tcc-performance-2026/tcc-benchmarks/backend-go:latest
          ports:
            - containerPort: 8082
          env:
            - name: DATABASE_URL
              value: postgres://user:password@postgres-db:5432/gateway_db
            - name: MOCK_API_URL
              value: http://mock-api:8080/process-payment
            - name: REDIS_URL
              value: redis://redis-cache:6379
            - name: PORT
              value: "8082"
            - name: PG_MAX_CONNS
              value: "200"
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-go
  namespace: tcc
spec:
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: backend-go
